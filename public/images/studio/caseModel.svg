<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400">
	<!-- 3D model: a landscape tile with the model turning and its "View in 3D" button -->
	<style>
		.tile { fill: #808080; fill-opacity: 0.4; }
		.shape, .button { fill: #808080; fill-opacity: 0.75; }
		.shape { transform-box: fill-box; transform-origin: center; animation: turn 3.2s ease-in-out infinite; }
		@keyframes turn {
			0%, 100% { transform: scaleX(1); }
			50% { transform: scaleX(0.12); }
		}
		@media (prefers-reduced-motion: reduce) { .shape { animation: none; } }
	</style>
	<rect class="tile" x="20" y="115" width="260" height="170" rx="10" />
	<circle class="shape" cx="150" cy="195" r="40" />
	<rect class="button" x="32" y="263" width="58" height="12" rx="6" />
</svg>
