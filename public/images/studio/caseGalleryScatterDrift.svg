<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400">
	<!-- Scatter Drift: tilted 4:3 cards in three lanes — the centre lane rising, the sides
	     falling — stepping one card at a time with no rest, so it reads as one motion. -->
	<style>
		.stage { fill: #808080; fill-opacity: 0.12; }
		.card { fill: #808080; fill-opacity: 0.45; }
		.lane { animation: 1.05s cubic-bezier(0.4, 0, 0, 1.08) infinite; }
		.rise { animation-name: rise; }
		.fall { animation-name: fall; }
		@keyframes rise { to { transform: translateY(-130px); } }
		@keyframes fall { to { transform: translateY(130px); } }
		@media (prefers-reduced-motion: reduce) { .lane { animation: none; } }
	</style>
	<clipPath id="frame"><rect width="300" height="400" rx="10" /></clipPath>
	<rect class="stage" width="300" height="400" rx="10" />
	<g clip-path="url(#frame)">
		<!-- Each lane repeats its cards every 130px, so a one-step shift loops seamlessly -->
		<g class="lane fall">
			<rect class="card" x="-40" y="-200" width="104" height="78" rx="6" transform="rotate(-7 12 -161)" />
			<rect class="card" x="-40" y="-70" width="104" height="78" rx="6" transform="rotate(5 12 -31)" />
			<rect class="card" x="-40" y="60" width="104" height="78" rx="6" transform="rotate(-7 12 99)" />
			<rect class="card" x="-40" y="190" width="104" height="78" rx="6" transform="rotate(5 12 229)" />
			<rect class="card" x="-40" y="320" width="104" height="78" rx="6" transform="rotate(-7 12 359)" />
		</g>
		<g class="lane rise">
			<rect class="card" x="86" y="-5" width="128" height="96" rx="7" transform="rotate(4 150 43)" />
			<rect class="card" x="86" y="125" width="128" height="96" rx="7" transform="rotate(-5 150 173)" />
			<rect class="card" x="86" y="255" width="128" height="96" rx="7" transform="rotate(4 150 303)" />
			<rect class="card" x="86" y="385" width="128" height="96" rx="7" transform="rotate(-5 150 433)" />
			<rect class="card" x="86" y="515" width="128" height="96" rx="7" transform="rotate(4 150 563)" />
		</g>
		<g class="lane fall">
			<rect class="card" x="236" y="-135" width="104" height="78" rx="6" transform="rotate(6 288 -96)" />
			<rect class="card" x="236" y="-5" width="104" height="78" rx="6" transform="rotate(-6 288 34)" />
			<rect class="card" x="236" y="125" width="104" height="78" rx="6" transform="rotate(6 288 164)" />
			<rect class="card" x="236" y="255" width="104" height="78" rx="6" transform="rotate(-6 288 294)" />
			<rect class="card" x="236" y="385" width="104" height="78" rx="6" transform="rotate(6 288 424)" />
		</g>
	</g>
</svg>
