<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400">
	<!-- Scatter Drift: one 4:3 card rests in the centre, then rises off the top as the next
	     comes up from below, as if both rode the rim of a wheel — each card's tilt is tied to
	     its height (-108° per stage height), so the new one enters nearly sideways and unwinds
	     upright. Timings and curves are AnimatedGallery/ScatterDrift/layout.ts (2.4s a card).
	     Each card's 4.8s life is its entrance, then its rest and exit, so two cards half a
	     life apart make the whole loop. Moving and turning share one easing, which keeps the
	     tilt in step with the height. -->
	<style>
		.stage { fill: #808080; fill-opacity: 0.12; }
		.card {
			fill: #808080;
			fill-opacity: 0.45;
			transform-box: fill-box;
			transform-origin: center;
			animation: life 4.8s linear infinite;
		}
		.later { animation-delay: -2.4s; }
		@keyframes life {
			0%, 5.208% { transform: translateY(332px) rotate(-89.64deg); animation-timing-function: cubic-bezier(0.35, 0.2, 0, 0.95); }
			33.125%, 51.458% { transform: translateY(0) rotate(0deg); animation-timing-function: cubic-bezier(0.61, 0.04, 0.19, 0.8); }
			72.083%, 100% { transform: translateY(-320px) rotate(86.4deg); }
		}
		@media (prefers-reduced-motion: reduce) { .card { animation: none; } }
	</style>
	<clipPath id="frame"><rect width="300" height="400" rx="10" /></clipPath>
	<rect class="stage" width="300" height="400" rx="10" />
	<g clip-path="url(#frame)">
		<rect class="card" x="51" y="125.75" width="198" height="148.5" rx="8" />
		<rect class="card later" x="51" y="125.75" width="198" height="148.5" rx="8" />
	</g>
</svg>
