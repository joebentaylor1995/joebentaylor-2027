<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400">
	<!-- Parallax gallery: a full-width tile whose slides wipe in from the right, with a row of
	     thumbnails along the bottom tracking the current slide (desktop). The strip repeats its
	     first slide at the end, so the jump back to the start is invisible. -->
	<style>
		.stage { fill: #808080; fill-opacity: 0.12; }
		.slide { fill: #808080; }
		.a { fill-opacity: 0.45; }
		.b { fill-opacity: 0.3; }
		.strip { animation: wipe 4.8s infinite; }
		@keyframes wipe {
			0%, 30% { transform: translateX(0); animation-timing-function: cubic-bezier(0.6, 0.08, 0.02, 0.99); }
			48%, 80% { transform: translateX(-260px); animation-timing-function: cubic-bezier(0.6, 0.08, 0.02, 0.99); }
			98%, 100% { transform: translateX(-520px); }
		}
		.thumb { fill: #fff; fill-opacity: 0.25; stroke: #fff; stroke-opacity: 0.3; }
		.on1 { animation: on1 4.8s infinite; }
		.on2 { animation: on2 4.8s infinite; }
		@keyframes on1 { 0%, 30%, 98%, 100% { fill-opacity: 0.9; } 48%, 80% { fill-opacity: 0.25; } }
		@keyframes on2 { 0%, 30%, 98%, 100% { fill-opacity: 0.25; } 48%, 80% { fill-opacity: 0.9; } }
		@media (prefers-reduced-motion: reduce) { .strip, .on1, .on2 { animation: none; } }
	</style>
	<clipPath id="tile"><rect x="20" y="119" width="260" height="162" rx="10" /></clipPath>
	<rect class="stage" width="300" height="400" rx="10" />
	<g clip-path="url(#tile)">
		<g class="strip">
			<rect class="slide a" x="20" y="119" width="260" height="162" />
			<rect class="slide b" x="280" y="119" width="260" height="162" />
			<rect class="slide a" x="540" y="119" width="260" height="162" />
		</g>
	</g>
	<rect class="thumb on1" x="117" y="255" width="30" height="20" rx="3" />
	<rect class="thumb on2" x="153" y="255" width="30" height="20" rx="3" />
</svg>
