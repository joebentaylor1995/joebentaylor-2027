# Netlify config for Next.js
# The Next.js plugin runs after build and deploys the app via serverless/edge.
# In Netlify UI: Build & deploy → Build settings → Publish directory must be EMPTY.

[build]
  command = "bun run build"

[build.environment]
  NODE_VERSION = "25"
  BUN_VERSION = "1.4.2"
  # Recreate nested dependencies from the lockfile when restoring Netlify's cache.
  # Sanity clients 7 and 8 require separate get-it major versions.
  BUN_FLAGS = "--frozen-lockfile --force"

[[plugins]]
  package = "@netlify/plugin-nextjs"


# Audit the live deploy with the project's pinned Lighthouse version.
# Desktop and mobile are separate reports; results never block publication.
[[plugins]]
  package = "./plugins/lighthouse"

  [plugins.inputs]
    paths = ["/"]
    optional_paths = ["/projects/", "/projects/pocketchange/"]
    runs = 3
