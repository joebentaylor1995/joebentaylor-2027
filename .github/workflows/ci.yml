name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # A real site URL so robots and canonical metadata render as in
      # production — without one the site is deliberately noindex
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # Use the committed dependency graph; never silently resolve another one.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Generated from the TS tokens — fails if src/theme changed without
      # running `bun run styles`
      - name: Check generated styles
        run: bun run styles --check

      - name: Lint (Biome + Stylelint)
        run: bun run lint

      - name: Type-check
        run: bun run type-check

      - name: Build
        run: bun run build

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Smoke test
        run: bun run test

      # Fails below the floor in lighthouserc.js (desktop) — Performance 80,
      # Best Practices 90, SEO 100, every Agentic Browsing check passing
      - name: Lighthouse
        run: bunx lhci autorun
